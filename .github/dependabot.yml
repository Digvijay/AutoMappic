version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Microsoft.Build.*, Microsoft.NET.StringTools and Microsoft.Build.Locator
      # ship from the MSBuild repository as a matched set and are loaded into a
      # single MSBuild instance at run time. Updating one without the others
      # produces a mixed-version closure -- taking StringTools 18.x while the
      # rest sat at 17.14.28 both skewed that set and dropped net9.0 support.
      # Group them so Dependabot can only propose them together.
      msbuild:
        patterns:
          - "Microsoft.Build"
          - "Microsoft.Build.*"
          - "Microsoft.NET.StringTools"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis.*"
      test-dependencies:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # vitepress-plugin-mermaid (latest: 2.0.17) declares a peer range of
      # mermaid "10 || 11". Taking mermaid 12 satisfies npm's version check but
      # violates that peer range, so `npm ci` fails ERESOLVE and the docs site
      # stops deploying. Hold the major until the plugin supports mermaid 12,
      # or until the docs move to a maintained alternative.
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
