name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # 8.0.x is needed as well as 10.0.x: AutoMappic.Core ships a net8.0
        # target, so there are tests to execute on it.
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore AutoMappic.sln

    - name: Build
      run: dotnet build AutoMappic.sln --no-restore --configuration Release

    - name: Test
      # Run every shipped target framework, and both test projects. Previously
      # this ran AutoMappic.Tests on its single TFM only, so the CLI's tests
      # never executed in CI at all.
      run: |
        dotnet run --project tests/AutoMappic.Tests/AutoMappic.Tests.csproj --configuration Release --no-build -f net8.0
        dotnet run --project tests/AutoMappic.Tests/AutoMappic.Tests.csproj --configuration Release --no-build -f net10.0
        dotnet run --project tests/AutoMappic.Cli.Tests/AutoMappic.Cli.Tests.csproj --configuration Release --no-build -f net10.0

    - name: Pack
      env:
        PublicRelease: true
      run: |
        dotnet pack src/AutoMappic.Core/AutoMappic.Core.csproj -c Release -o ./artifacts
        dotnet pack src/AutoMappic.Cli/AutoMappic.Cli.csproj -c Release -o ./artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg

  release:
    name: Publish to NuGet
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download Artifacts
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
